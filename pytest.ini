[pytest]
addopts = 
    --alluredir=allure-results
    --clean-alluredir
    -v
    -s
    --tb=short

markers =
    smoke: marks tests as smoke tests
    regression: marks tests as regression tests
    positive: marks tests as positive tests
    negative: marks tests as negative tests

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*